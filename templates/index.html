<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon S3 Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Loader simple */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-lg shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">S3 Drive</h1>
                <p class="text-sm text-gray-500 mt-1">Bucket : <span class="font-semibold">{{ bucket }}</span> | Région : {{ region }}</p>
            </div>
            
            <!-- Zone d'upload -->
            <form id="uploadForm" class="flex items-center gap-4">
                <input type="file" id="fileInput" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition text-sm font-medium disabled:opacity-50" id="uploadBtn">
                    Uploader
                </button>
            </form>
        </header>

        <!-- Messages d'alerte -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-md text-sm"></div>

        <!-- Liste des fichiers -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100 text-sm text-gray-600">
                        <th class="p-4 font-medium">Nom du fichier</th>
                        <th class="p-4 font-medium">Taille</th>
                        <th class="p-4 font-medium">Modifié le</th>
                        <th class="p-4 font-medium text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="fileList">
                    <tr>
                        <td colspan="4" class="p-8 text-center text-gray-500">
                            <div class="flex justify-center"><div class="loader"></div></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fonction pour afficher des messages (succès ou erreur)
        const showAlert = (message, isError = false) => {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `mb-6 p-4 rounded-md text-sm font-medium ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 5000);
        };

        // 1. Lister les fichiers
        const loadFiles = async () => {
            const tbody = document.getElementById('fileList');
            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                if (!data.success) throw new Error(data.error);

                if (data.files.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">Le Bucket est vide.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.files.map(file => `
                    <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                        <td class="p-4 font-medium text-gray-700">${file.name}</td>
                        <td class="p-4 text-sm text-gray-500">${file.size}</td>
                        <td class="p-4 text-sm text-gray-500">${file.last_modified}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="downloadFile('${file.key}')" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Télécharger</button>
                            <button onclick="deleteFile('${file.key}')" class="text-red-600 hover:text-red-800 text-sm font-medium">Supprimer</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">Erreur: ${error.message}</td></tr>`;
            }
        };

        // 2. Uploader un fichier
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('uploadBtn');
            const file = fileInput.files[0];
            
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            btn.disabled = true;
            btn.textContent = 'Envoi...';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    showAlert(data.message);
                    fileInput.value = ''; // Reset input
                    loadFiles(); // Rafraîchir la liste
                } else {
                    showAlert(data.error, true);
                }
            } catch (error) {
                showAlert("Erreur lors de l'upload.", true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Uploader';
            }
        });

        // 3. Télécharger un fichier
        const downloadFile = async (key) => {
            try {
                const response = await fetch(`/api/download/${encodeURIComponent(key)}`);
                const data = await response.json();
                
                if (data.success) {
                    // Ouvre l'URL pré-signée générée par boto3 dans un nouvel onglet
                    window.open(data.url, '_blank');
                } else {
                    showAlert(data.error, true);
                }
            } catch (error) {
                showAlert("Erreur lors du téléchargement.", true);
            }
        };

        // 4. Supprimer un fichier
        const deleteFile = async (key) => {
            if (!confirm(`Voulez-vous vraiment supprimer "${key}" ?`)) return;

            try {
                const response = await fetch(`/api/delete/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    showAlert(data.message);
                    loadFiles(); // Rafraîchir la liste
                } else {
                    // Gestion de l'erreur 403 simulée dans votre back-end
                    showAlert(data.detail || data.error, true);
                }
            } catch (error) {
                showAlert("Erreur lors de la suppression.", true);
            }
        };

        // Charger les fichiers au démarrage
        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
